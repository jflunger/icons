# icon.adun.ai -> Icon Search (vibe project "icons", 127.0.0.1:9005).
#
# HTTPS matters here beyond tidiness: the Clipboard API (Copy PNG, rich Copy SVG)
# only works in a secure context, so over plain http those buttons are degraded.
#
# Install (as root), same flow as the other adun.ai sites:
#   1. DNS: A record icon.adun.ai -> YOUR.SERVER.IP; check `dig +short icon.adun.ai`
#   2. cp deploy/nginx-icon.conf /etc/nginx/sites-available/icon
#      ln -sf /etc/nginx/sites-available/icon /etc/nginx/sites-enabled/icon
#      nginx -t && systemctl reload nginx
#   3. certbot --nginx -d icon.adun.ai
#      After this, certbot owns the installed copy (it adds the 443 server + redirect).

server {
    listen 80;
    listen [::]:80;
    server_name icon.adun.ai;

    # SVG/JSON compress well; icon pages ship a lot of inline SVG markup.
    gzip on;
    gzip_types application/json image/svg+xml text/css application/javascript;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:9005;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # First-start ingest can hold the index for a few seconds; ZIPs of 200 icons are quick.
        proxy_read_timeout 60s;
    }
}
