[project]
name = "iconsearch"
version = "0.1.0"
description = "Self-hosted search over free icon sets, with drag/copy into PowerPoint"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["iconsearch", "iconsearch.ingest", "iconsearch.ingest.enrich"]

[tool.pytest.ini_options]
testpaths = ["tests"]
